name: ingest

# The daily market snapshot. Writes data/live/*.json and commits it, so
# the site stays entirely static and a failed run degrades to yesterday's
# numbers rather than to an error page.
#
# LIVE. The cron runs weekday evenings after the US close. A manual run
# still defaults to `--dry` so the plumbing can be exercised without
# writing a snapshot; untick the box to force a real fetch by hand.

on:
  workflow_dispatch:
    inputs:
      dry:
        description: "Dry run — exercise the plumbing, fetch nothing"
        type: boolean
        default: true
  schedule:
    - cron: "30 22 * * 1-5"     # weekdays, 22:30 UTC, after the US close

permissions:
  contents: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Ingest
        run: node scripts/ingest/run.mjs ${{ inputs.dry && '--dry' || '' }}

      - name: Validate what landed
        run: npm run check

      # `git add` on a path that has never existed is a fatal error, not a
      # no-op, so the directory is created first. It is tracked by a
      # .gitkeep, but a fresh checkout of an older commit would not have it.
      - name: Commit the snapshot
        run: |
          mkdir -p data/history
          git config user.name  "ingest"
          git config user.email "ingest@users.noreply.github.com"
          git add data/live data/history
          if git diff --staged --quiet; then
            echo "nothing moved"
          else
            git commit -m "data: market snapshot $(date -u +%Y-%m-%d)"
            # main may have moved while we were fetching; the snapshot is
            # append-only so a rebase can never conflict with hand edits.
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && exit 0
              sleep 5
            done
            echo "could not push after three attempts" >&2
            exit 1
          fi
